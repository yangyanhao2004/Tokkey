<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Renderer runs only bundled local code: no remote scripts, no inline scripts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Tokiie</title>
    <link rel="stylesheet" href="./index.css" />
    <script src="./renderer.js" defer></script>
  </head>
  <body class="bg-[#ececec] font-sans">
    <!-- 10px is the gap Figma leaves between the aside and the main page. -->
    <div id="app" class="flex h-full gap-[10px] p-[11px]"></div>
  </body>
</html>
